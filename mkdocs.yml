site_name: FinWheel
site_description: A prize wheel and raffle overlay for OBS and Twitch, driven from an OBS dock.
site_url: https://platob.github.io/finwheel/
repo_url: https://github.com/Platob/finwheel
repo_name: Platob/finwheel
edit_uri: edit/main/docs/

nav:
  - Live wheels: index.md
  - Guide:
      - Setup: setup.md
      - Twitch: twitch.md
      - Playing: playing.md
      - Looks & photos: looks.md
      - Wheels & prizes: wheels.md
  - Reference:
      - HTTP API: api.md
      - Configuration: configuration.md
      - Troubleshooting: troubleshooting.md
      - Development: development.md

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: pink
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: pink
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - search.highlight
    - toc.follow

# The live wheels (`npm run build:showcase` writes docs/live/): a page shows them wherever it has a
# `.fw-live` mount point; pages without one load nothing else.
extra_css:
  - stylesheets/extra.css
  - live/assets/showcase.css

extra_javascript:
  - path: live/showcase.js
    type: module

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    not_found: warn
    anchors: warn
